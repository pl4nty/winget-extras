Description: Noto Sans CJK JP is part of Noto, a collection of high-quality fonts with multiple weights and widths in sans, serif, mono, and other styles, designed for harmonious, typographically correct communication in more than 1,000 languages and over 150 writing systems. Noto Sans CJK JP is the Japanese language-specific variant of Noto Sans CJK, the sans serif Pan-CJK typeface family from the Noto CJK project. This package contains seven weights of OpenType/CFF fonts for Japanese text. It installs the Japanese variant without the separate Simplified Chinese, Traditional Chinese, and Korean variants included in the combined Noto Sans CJK package.
