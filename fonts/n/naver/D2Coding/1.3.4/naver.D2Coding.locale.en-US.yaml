ShortDescription: A fixed-width font optimized for coding and character distinction.
Description: D2 Coding is a fixed-width font optimized for coding, readability, and distinction between similar Latin, Hangul, numeric, and symbol characters.
Moniker: d2coding
ReleaseNotes: |-
  D2Coding 1.3.4 widens twenty symbols that were drawn at half width although Unicode classes them as East Asian Wide, and rebuilds the superscripts, subscripts and fractions.
  Please uninstall any previously installed version before installing.
  What changed
  - ◽ ◾ ☔ ☕ ♈ ♉ ♊ ♋ ♌ ♍ ♎ ♏ ♐ ♑ ♒ ♓ ♿ ⚓ ⚡ and the wave dash 〜 (U+301C) now have the same advance as a Hangul syllable. Terminals give these characters two columns, so the glyph used to fill only the left half of its cell (#72, #91). The drawings are unchanged in size and centered in the wider cell. The wave dash used to share its glyph with the tilde operator ∼ (U+223C), which stays half width, so it now has a glyph of its own.
  - Symbols that Unicode classes as Ambiguous or Neutral, such as ★ ◆ → “ ” …, keep their half width.
  - The superscripts, subscripts and vulgar fractions (U+2070 to U+209C, U+2150 to U+215F) are rebuilt to the proportions of the drawn ¹ ² ³ and ¼ ½ ¾, and they are bold in the bold font (#102).

  Contents
  - D2Coding/ - standard build (TTC + Regular/Bold TTF)
  - D2CodingLigature/ - coding ligature build (TTC + Regular/Bold TTF)
  - D2CodingAll/ - TTC bundling all four faces
  Full history: CHANGELOG.md
