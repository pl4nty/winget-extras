ReleaseNotes: |-
  D2Coding 1.3.3 is a metadata-only release. No outline, metric or OpenType data was changed: only the name and head tables were rewritten, every other table is byte identical to 1.3.2, and shaping output is unchanged.
  Please uninstall any previously installed version before installing.
  What changed
  - The copyright, trademark and vendor URL records still credited NHN Corporation. NAVER Corporation was spun off from NHN in 2013 and is the copyright holder, so those records now read NAVER Corporation and https://www.navercorp.com.
  - The license URL (name ID 14) pointed at http://dev.naver.com/wiki/nanumfont/index.php/OpenFontLicense, which is dead. It now points at https://openfontlicense.org.
  - OFL.txt is included in the archive. The full license text used to live only in the project wiki.

  Contents
  - D2Coding/ - standard build (TTC + Regular/Bold TTF)
  - D2CodingLigature/ - coding ligature build (TTC + Regular/Bold TTF)
  - D2CodingAll/ - TTC bundling all four faces
  Related: google/fonts#1538
