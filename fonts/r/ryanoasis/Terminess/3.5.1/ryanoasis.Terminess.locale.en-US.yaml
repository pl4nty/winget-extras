Description: |-
  Terminus TTF is a TrueType version of the Terminus fixed-width bitmap font.
  It contains the original embedded bitmaps and automatically generated scalable outlines (traced with Potrace).
  The generated outlines may differ slightly from the original bitmaps and can look smeary unless rendered in monochrome.
