ShortDescription: A workhorse monospace typeface designed for source code, with excellent legibility and Powerline support included.
Description: |-
  Go Mono is the slab-serif monospaced member of the Go font family designed by Bigelow & Holmes for the Go project while sharing the same open source license as the programming language itself.
  It combines humanist-derived letterforms with slab serifs and a larger-than-average x-height (53% of body size) so that even at small sizes the ANSI punctuation, operators, and letters remain highly distinguishable and consistent with the DIN 1450 legibility standard.
  Go Mono maintains metric compatibility with classic 10-pica typewriter widths yet appears almost 18% larger than Courier thanks to its generous proportions, and it ships with the WGL4 character set for broad Western, Greek, and Cyrillic coverage.
