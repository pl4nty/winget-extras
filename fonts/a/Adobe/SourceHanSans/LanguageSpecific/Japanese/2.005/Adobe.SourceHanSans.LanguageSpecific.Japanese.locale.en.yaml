Description: Source Han Sans, designed by Ryoko Nishizuka (西塚涼子), is the companion sans serif-style Pan-CJK type-face family to Source Han Serif, and is offered in seven weights—ExtraLight, Light, Normal, Regular, Medium, Bold, and Heavy—and in several OpenType/CFF-based deployment configurations to accommodate various system requirements or, in some cases, limitations. Pan-CJK fonts, such as those provided by the Source Han typeface families, are intended to support and render the most important characters for Simplified Chinese, Traditional Chinese, Japanese, and Korean.
