ReleaseNotes: |-
  English

  Added
  - Add a single-line desktop news ticker, enabled and floating by default, with a persistent enable switch, hover controls, smooth pause and headline navigation, source and unread filters, nested settings in the main window, preset palettes, and remembered floating position and drag-resized width. Open headlines in MrRSS or a browser. Docking does not reserve other applications’ work area. (#832)
  - Schedule independent FreshRSS and Miniflux synchronization, including optional startup sync and settings controls. Manual refresh also syncs readers when a feed or category is selected. (#1278)

  Fixed
  - Keep desktop development pages and dynamically imported modules on the Wails frontend proxy, and align the development server and readiness probe on IPv4 loopback to prevent blank or failed previews.
  - Keep background translation failures quiet while preserving manual error feedback; translate generated summaries, retain the open article beside its neighbours during unread refreshes, and restore proxied webpage styles and stylesheet-relative resources. (#1259)
  - Reduce the initial web bundle by importing only used Phosphor icons, and gzip frontend text assets in server mode while preserving API and media responses. (#1270, @marcomarcogd)
  - Fit the article reader and settings on narrow screens, restore normal article image sizing, and close dialogs and the reader in order when using the mobile browser Back button. (#1273)
  - Keep distinct same-title articles using provider item IDs or article URLs, and migrate existing identities without losing reading state, favorites, cached content, or chat history. (#1276)
  - Prevent stale SQLite write snapshots during parallel refreshes and apply bounded backoff to repeatedly failing automatic feed refreshes; manual refresh can retry immediately. (#1277)
  - Keep toast notifications above nested modal overlays. (#1279)
  - Require native desktop authorization for update download and installation, validate official release assets and SHA-256 integrity, and prevent unsafe archive extraction. Server mode uses manual updates. (GHSA-4m74-8q96-mp63, @haveadooday)

  Changed
  - Update reviewed backend, frontend, and website dependencies, and align the Wails build CLI with the backend module. (#1267, #1268, #1274, #1275)

  中文

  新增
  - 新增默认启用并浮动的单行桌面滚动新闻条，支持记忆启用开关、悬停操作、平滑暂停与标题切换、订阅来源和未读筛选、主窗口内的统一子设置、预设配色及浮动位置和拖动调整后的宽度记忆；标题可在 MrRSS 或浏览器中打开。贴靠暂不调整其他应用的最大化工作区域。 (#832)
  - FreshRSS 和 Miniflux 支持独立定时同步、可选的启动同步及对应设置；选中订阅源或分类后，手动刷新也会同步阅读器。 (#1278)

  修复
  - 桌面开发模式统一通过 Wails 前端代理加载页面和动态模块，并让开发服务及启动检查使用相同的 IPv4 本地地址，避免预览白屏或连接失败。
  - 避免后台翻译的零星失败反复弹窗，保留手动翻译失败提示；补齐生成摘要的译文，未读列表刷新时保持当前文章的相邻位置，并修复原文视图的样式和 CSS 相对资源加载。 (#1259)
  - 按需导入 Phosphor 图标以缩减首屏脚本，并在 server 模式自动 gzip 压缩前端文本静态资源，保留 API 和媒体响应行为。 (#1270, @marcomarcogd)
  - 改善窄屏阅读器与设置布局，恢复正文图片正常尺寸；移动浏览器返回键会依次关闭弹窗和阅读器。 (#1273)
  - 优先使用阅读器条目 ID 或文章链接区分同标题文章，并安全迁移历史去重标识，保留阅读状态、收藏、正文缓存及聊天记录。 (#1276)
  - 避免并发刷新时 SQLite 写事务使用过期快照；连续失败的自动订阅刷新采用有上限的退避，手动刷新可立即重试。 (#1277)
  - 保证提示消息始终显示在多层弹窗上方。 (#1279)
  - 更新下载和安装必须取得原生桌面授权，校验官方发布资源与 SHA-256 完整性，并阻止不安全的压缩包解压；server 模式使用手动更新。 (GHSA-4m74-8q96-mp63, @haveadooday)

  调整
  - 更新已审核的后端、前端和网站依赖，并保持 Wails 构建工具与后端模块版本一致。 (#1267, #1268, #1274, #1275)
