ReleaseNotes: |-
  English

  Added
  - Select multiple subscriptions for the desktop news ticker and hover over a headline to preview its description. (#1281)
  - On Windows, reserve space for the news ticker above the taskbar or keep it on the desktop when using Win+D. (#1281)

  Fixed
  - Hide Windows console windows when refreshing script feeds and changing the launch-at-login setting. (#1282) (@ClutchBear)
  - Resolve Windows data directory junctions used by Scoop before opening app storage. (#1286)
  - Report failed FreshRSS and Miniflux syncs, preserve the last successful sync time, and give queued edits a separate push deadline. (#1287)
  - Isolate original webpage previews from MrRSS settings and data while preserving styles, images, and outbound links. (GHSA-w922-2r33-vcx4) (@orshih6)

  中文

  新增
  - 桌面滚动新闻条支持多选订阅源，鼠标悬停在标题上可预览简介。 (#1281)
  - Windows 上可为新闻条在任务栏上方预留空间，也可将新闻条放在桌面上，按 Win+D 时仍可见。 (#1281)

  修复
  - Windows 刷新脚本订阅或修改开机启动设置时隐藏控制台窗口。 (#1282) (@ClutchBear)
  - 打开存储前解析 Scoop 使用的 Windows 目录联接。 (#1286)
  - 显示 FreshRSS 和 Miniflux 的同步失败原因，保留上次成功同步时间，并为待推送的更改提供独立的超时时间。 (#1287)
  - 隔离原网页预览与 MrRSS 设置和数据，保留网页样式、图片及外部链接。 (GHSA-w922-2r33-vcx4) (@orshih6)
