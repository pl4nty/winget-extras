ReleaseNotes: |-
  What's Changed

  Features
  - feat(skills): let a skill opt in to disable-model-invocation for the shared .agents/skills root with agentsskills.disable-model-invocation: true|false. The key is emitted only for agentsskills, GitLab Duo project scope and the simulated agentsmd writer, and import restores it into the agentsskills section. The default output stays spec-compliant. by @dyoshikawa in #3689

  Bug Fixes
  - fix(sources): lock each entry of a repository declared more than once separately, so multiple paths from the same repository no longer collapse into one lock entry. Lock keys stay bare for a repository declared once, and existing lock entries are carried over when a key changes. by @dyoshikawa in #3690

  Documentation
  - docs(mcp): note that the musecode MCP writer does not take Muse Code's settings.json lock, so generate --global should not run while Muse Code is running. by @dyoshikawa in #3688

  Contributors
  - @dyoshikawa
