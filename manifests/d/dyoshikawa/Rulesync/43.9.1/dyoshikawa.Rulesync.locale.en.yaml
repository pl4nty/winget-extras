ReleaseNotes: |-
  What's Changed

  Bug Fixes
  - fix(permissions): withhold root-dotted webfetch host allows by @jdotc1 in #3851
    - Permission-overlap checks now also compare a host with its terminal DNS root dot removed, so example.com. and example.com are treated as the same host (including internationalized names). An allow that a root-dotted restriction shadows, or the reverse, is now withheld on tools that cannot express the restriction. The original spelling is still compared too, so this only ever withholds more.
  - fix(hooks): give each OpenCode 2.x hooks plugin file its own id by @Lartweib in #3853
    - The generated OpenCode 2.x hooks plugin used the fixed id rulesync-hooks. OpenCode loads only the first plugin with a given id, so a global hooks plugin silently kept the project's (and a parent directory's) hooks from running. Each generated file now gets its own id. Regenerate to pick it up. Note that hooks configured in several scopes now all run.

  Documentation
  - docs(sources): explain local skill invocation overrides by @521Peter in #3859

  Maintenance
  - chore: update Homebrew formula to v43.9.0 by @dyoshikawa in #3858

  Contributors
  - @jdotc1
  - @Lartweib
  - @521Peter
  - @dyoshikawa
