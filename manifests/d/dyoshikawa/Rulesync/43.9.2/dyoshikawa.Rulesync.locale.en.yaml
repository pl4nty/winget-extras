ReleaseNotes: |-
  What's Changed

  Bug Fixes
  - fix(npm): report tarball extraction limits instead of a generic gunzip failure by @dyoshikawa in #3870
    - An npm-transport source whose package unpacks past the extraction limits (100 MB of file data, 10,000 files) now fails with Package <name>@<version> unpacks to more than the npm transport's extraction limit (...) instead of Failed to gunzip package tarball, so a large package is no longer mistaken for a corrupt download. The limits themselves are unchanged and are now documented.
  - fix(permissions): also compare hosts with all trailing dots removed by @dyoshikawa in #3868
    - Permission-overlap checks also treat example.com.. like example.com. The extra comparison only adds overlaps, so it can only withhold more allows.

  Documentation
  - docs: follow-ups for local skill invocation overrides and the per-file OpenCode plugin id by @dyoshikawa in #3869

  Maintenance
  - chore: update Homebrew formula to v43.9.1 by @dyoshikawa in #3865

  Contributors
  - @dyoshikawa
