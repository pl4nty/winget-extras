ReleaseNotes: |-
  What's Changed

  ⚠️ Breaking Changes
  - Codewhale: when the permissions deny every shell command (* / ** under bash, or the all-tools * category), project-scope generate now writes allow_shell = false to the .codewhale/config.toml overlay, and import reads it back as bash: {"*": "deny"} by @dyoshikawa in #3382
  - omp (oh-my-pi): canonical stop hooks, previously skipped, are now emitted as session_stop handlers; exit code 2 continues the session with the hook's feedback by @dyoshikawa in #3383

  Features
  - feat(codewhale): disable shell in the project config overlay when every shell command is denied by @dyoshikawa in #3382
  - feat(hooks): map omp stop hooks to session_stop by @dyoshikawa in #3383

  Other Changes
  - chore: update Homebrew formula to v31.0.0 by @dyoshikawa in #3397

  Contributors
