ReleaseNotes: |-
  What's Changed

  Fixes
  - OpenCode / MiMo Code: keep a disabled MCP tool disabled when two servers sanitize to the same name, so a deny wins regardless of server order (#3699)

  Performance
  - Release binaries: the standalone binaries are now compiled ahead of time with Bun's AOT compiler (bun compile) on a native runner per platform. On linux-x64, rulesync --version starts in ~35 ms instead of ~81 ms (Node: ~433 ms), peak memory roughly halves, and the binary shrinks from 163 MB to 104 MB (48 MB gzipped). The Windows binary now gets the same optimized build as the other platforms (#3718)

  Docs and maintenance
  - Dependency updates (#3705)

  Contributors
  - @dyoshikawa
  - @521Peter
