ReleaseNotes: |-
  What's Changed

  New Features
  - feat(codexcli): author the [tools] table through the permissions override by @dyoshikawa in #3856
    - The codexcli permissions override now accepts tools, written to the top-level [tools] table of .codex/config.toml (project and --global). For example, "codexcli": { "tools": { "update_plan": { "enabled": true } } } enables Codex's update_plan tool, which is off by default since Codex 0.152.0. The table is shallow-merged with the existing file, and rulesync import lifts it back into the override.

  Documentation
  - docs(sources): explain sharing config outside install lockfiles by @521Peter in #3850
  - docs(sources): complete the shared-configuration caveats and move the section by @dyoshikawa in #3855

  Maintenance
