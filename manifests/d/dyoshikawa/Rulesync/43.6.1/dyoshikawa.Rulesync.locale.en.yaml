ReleaseNotes: |-
  What's Changed

  Performance
  - rulesync generate is noticeably faster: an all-target, all-feature run on a project with dozens of skills dropped from 4.5 s to 2.8 s (−38%). Source skills are now loaded once per run instead of once per target, existing outputs are read before being stat'ed, and non-link path segments are remembered during a run. Generated output is byte-identical. by @dyoshikawa in #3764, #3765

  Internal
  - Codebase-wide refactoring: shared base classes and helpers across permissions, MCP, rules, hooks, commands, subagents and skills adapters; dead code removed; sources.ts split by transport. No behavior change (net −8,000 lines). by @dyoshikawa in #3765
  - ci: print the AOT explain report when building Bun binaries by @dyoshikawa in #3761
  - ci(draft-release): pin the OpenCode action to its last published tag by @dyoshikawa in #3748

  Contributors
  - @dyoshikawa
