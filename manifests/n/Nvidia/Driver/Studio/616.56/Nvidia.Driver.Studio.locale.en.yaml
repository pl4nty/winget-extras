ShortDescription: Drivers for NVIDIA graphics cards, validated for creative applications.
Moniker: nvidiastudiodriver
Description: |-
  Graphics and audio drivers for NVIDIA graphics cards, validated against creative applications rather than game releases.

  Studio and Game Ready drivers are the same driver built from the same branch; they differ in which test suite gates a release and how often one ships. Studio releases roughly monthly, Game Ready roughly fortnightly, so a Studio driver is usually an older snapshot of the same branch. Installing one replaces the other.

  Requires the Turing architecture or newer. NVIDIA has never shipped a Studio driver for Maxwell or Kepler, and the Pascal Studio line ended at 581.57.

  As with the regular NVIDIA driver installer, the screens will flicker once when the installation is complete.
