ShortDescription: Studio drivers for Pascal NVIDIA graphics cards (R580 branch).
Moniker: nvidiastudiodriverr580
Description: |-
  Studio drivers for NVIDIA graphics cards based on the Pascal architecture. This is the R580 branch, the last branch with a Studio build for these cards.

  Covers the GeForce 10 series and the TITAN X and TITAN Xp. Maxwell and Kepler cards never received a Studio driver at all.

  The Studio line for these cards stopped at 581.57 in October 2025. Game Ready security updates continue on the same branch and are packaged as Nvidia.Driver.GeForceGameReady.R580.

  As with the regular NVIDIA driver installer, the screens will flicker once when the installation is complete.
