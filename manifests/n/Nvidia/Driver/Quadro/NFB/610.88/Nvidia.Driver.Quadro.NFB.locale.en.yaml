ShortDescription: New Feature Branch drivers for NVIDIA RTX PRO and Quadro graphics cards.
Moniker: nvidiaquadronfb
Description: |-
  Graphics and audio drivers for NVIDIA RTX PRO, NVIDIA RTX and Quadro graphics cards, from the current New Feature Branch.

  NVIDIA maintains several professional driver branches at once. A New Feature Branch ships roughly quarterly and carries the newest features, with about a year of support. For API stability instead, use Nvidia.Driver.Quadro; Pascal and Volta cards are capped on the R580 branch and are packaged separately as Nvidia.Driver.Quadro.R580.

  One installer covers both desktop and notebook cards.

  As with the regular NVIDIA driver installer, the screens will flicker once when the installation is complete.
