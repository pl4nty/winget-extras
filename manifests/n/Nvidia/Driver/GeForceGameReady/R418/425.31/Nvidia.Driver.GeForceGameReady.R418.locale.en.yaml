ShortDescription: Drivers for Kepler-generation NVIDIA notebook GPUs (R418 branch).
Moniker: nvidiadriverr418
Description: |-
  Graphics and audio drivers for NVIDIA notebook GPUs whose final supported branch is R418. This branch is frozen; its last release shipped in April 2019.

  Covers Kepler-generation and rebadged notebook parts in the GeForce 600M, 700M, 800M and 900M series, such as the GTX 680M, GTX 780M, GTX 880M and the 910M and 920M. Desktop cards of the same era are not here: desktop Kepler is on R470, and Fermi is on R390.

  Windows 10 only. NVIDIA does not offer this driver for Windows 11.

  As with the regular NVIDIA driver installer, the screens will flicker once when the installation is complete.
