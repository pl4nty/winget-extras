ShortDescription: Drivers for Tesla-architecture NVIDIA graphics cards (R340 branch).
Moniker: nvidiadriverr340
Description: |-
  Graphics and audio drivers for NVIDIA graphics cards based on the Tesla architecture. This is the R340 branch, the last branch to support these cards.

  Covers the GeForce 8, 9, 100, 200 and 300 series and their notebook equivalents, plus Tesla-based rebadges in the 400 series such as the GT 415M.

  Windows 10 only, and 32-bit Windows is supported.

  As with the regular NVIDIA driver installer, the screens will flicker once when the installation is complete.
