ShortDescription: Drivere for NVIDIA-skærmkort.
Description: |-
  Grafik- og lyddrivere for NVIDIA-skærmkort.

  Per version 591.44, støtter driveren Turing-arkitekturen og nyere: GeForce 16-serien, RTX 20-, 30-, 40- og 50-serien, og TITAN RTX.

  Maxwell-, Pascal- og Volta-kort er på R580-grenen og pakkes separat som Nvidia.Driver.GeForceGameReady.R580. Ældre arkitekturer har deres egne .R470-, .R418-, .R390- og .R340-pakker.

  Som med den vanlige NVIDIA-driverinstallereren, vil skærmene blinke én gang, når installationen er fuldført.

  Til trods for flere forsøk på at gøre den her Winget-pakken i stand til, at blive opdaget med «winget update», har ingen sådan metode blevet fundet endnu.
