ShortDescription: Drivers for NVIDIA graphics cards.
Description: |-
  Graphics and audio drivers for NVIDIA graphics cards.

  As of version 591.44, the driver supports the Turing architecture and newer: the GeForce 16 series, the RTX 20, 30, 40 and 50 series, and the TITAN RTX.

  Maxwell, Pascal and Volta cards are on the R580 branch and are packaged separately as Nvidia.Driver.GeForceGameReady.R580. Older architectures have their own .R470, .R418, .R390 and .R340 packages.

  As with the regular NVIDIA driver installer, the screens will flicker once when the installation is complete.

  Despite several attempts to make this Winget package detectable with «winget update», no such method has been found yet.
