ShortDescription: Drivers for Maxwell, Pascal and Volta NVIDIA graphics cards (R580 branch).
Description: |-
  Graphics and audio drivers for NVIDIA graphics cards based on the Maxwell, Pascal and Volta architectures. This is the R580 branch, the last branch to support these cards.

  Covers the GeForce 900 series, the GeForce 10 series, the GTX 750, GTX 750 Ti and GTX 745, and the TITAN X, TITAN Xp and TITAN V. Kepler cards are not supported here, including the GTX 770, GTX 780, GTX 780 Ti and the GT 710 to GT 740 - use Nvidia.Driver.GeForceGameReady.R470 for those.

  Game Ready optimisations for these cards ended in October 2025. R580 is a Long Term Support Branch and continues to receive quarterly security updates until October 2028.

  As with the regular NVIDIA driver installer, the screens will flicker once when the installation is complete.
