ShortDescription: A companion for NVIDIA-using PC gamers and creators. Optimise games and apps with a new unified GPU control centre, powerful recording tools through the in-game overlay, and discover the latest NVIDIA tools and software.
Description: |-
  A companion for NVIDIA-using PC gamers and creators. Optimise games and apps with a new unified GPU control centre, powerful recording tools through the in-game overlay, and discover the latest NVIDIA tools and software.

  The app replaces GeForce Experience and the NVIDIA Control Panel, and installs and updates GeForce Game Ready and NVIDIA Studio drivers.

  An NVIDIA GPU is required: on a machine without one the installer exits with 0xE6000000, which this manifest maps to systemNotSupported.
