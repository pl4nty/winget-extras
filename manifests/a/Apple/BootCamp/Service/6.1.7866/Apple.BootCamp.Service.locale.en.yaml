ShortDescription: The core compontent of Apple's Boot Camp environment, which runs Windows on supported x64 Mac devices.
Description: |
  The core component of the Apple Boot Camp environment, which runs Windows on supported x64 Mac devices.

  As of September 2026, it is known that it actually can be installed in a native non-Mac Windows environment, that its post-installation Bootcamp.exe can also be run, as can the resulting system tray "About Boot Camp" option. However, the "Boot Camp Control Panel" and "Restart in macOS" options likely require a Mac to work.
