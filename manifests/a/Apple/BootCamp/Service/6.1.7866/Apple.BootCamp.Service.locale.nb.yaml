PackageIdentifier: Apple.BootCamp.Service
PackageVersion: 6.1.7866
PackageLocale: nb
PackageName: Boot Camp-tjeneste
License: Gratis
Description: |
  Hovedkjernen til Apple sitt Boot Camp-miljø, som kjører Windows på støttede x64-Mac-enheter.

  Per September 2026, er det kjent at den faktisk kan installeres på standard ikke-Mac Windows-oppsett, at dens etterinstallasjonsfil Bootcamp.exe også kan kjøres, og likeså for det resulterende systemkurvalternativet «Om Boot Camp». Men dens «Boot Camp-kontrollpanel»- og «Start på nytt i macOS»-alternativer krever mest sannsynlig en Mac for å fungere.
