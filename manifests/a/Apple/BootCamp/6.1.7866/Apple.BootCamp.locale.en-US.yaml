Description: |-
  Installer for Boot Camp Control Panel and Boot Camp-related device drivers used to run Windows on Intel-processor mid-to-late-2010's macOS devices.

  This packages the offline "WindowsSupport" driver bundle (the same files Boot Camp Assistant writes to the Windows partition on a genuine Mac), rather than the standalone AppleBcUpdate.exe updater from Apple's Software Update catalog. That updater checks in with Apple and refuses to run ("This update is not intended for this computer and will not be installed.") unless it detects a supported Mac, which made it unusable via winget; this offline bundle does not perform that check.

  For unknown reasons, Apple included Boot Camp Control Panel in Boot Camp version 6.1.17 but not in 6.1.19 or later. This package is a Boot Camp 6.1.7866 installer, which predates that removal and still includes Boot Camp Control Panel.

  Not necessarily to be confused with the "Boot Camp Support Software" or "Boot Camp Assistant" apps.
