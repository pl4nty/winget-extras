ReleaseNotes: |-
  Being vulnerable is fine, but not when it comes to dependencies. That's why we're making this release with updated dependencies to keep AdGuard Home running smoothly and securely 💪
  Full changelog
  See also the v0.107.80 GitHub milestone.

  Security
  - Go version has been updated to mitigate the possibility of exploiting the Go vulnerabilities fixed in 1.27.3.
  - Support for Multipath TCP has been disabled to mitigate the possibility of exploiting the vulnerability described in CVE-2026-98432.

  Removed
  - The support for macOS 13 Ventura, see Go 1.27 release notes.
