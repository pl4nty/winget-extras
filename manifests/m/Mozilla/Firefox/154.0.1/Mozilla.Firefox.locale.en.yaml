ShortDescription: The legendary web browser by Mozilla.
Description: |-
  The legendary web browser by Mozilla.

  In contrast to the version in winget-pkgs, this winget-extras version contains 82 of Firefox's 103 locales in one package, with the Winget settings, OS settings, and/or "--locale" deciding which locale gets installed on fresh installs.

  With stock Winget settings, fresh installs install the .exe (nullsoft) version matching your locale. To install the MSIX version, use "winget install Mozilla.Firefox --installer-type msix -s winget-extras".

  To use a different .exe locale than your OS language, use "winget install Mozilla.Firefox --installer-type nullsoft -s winget-extras --locale [whichever language code you want]".

  The package also contains a portable version of Firefox, which uses the official MSIX version's files. To install that portable version, use "winget install Mozilla.Firefox --installer-type portable -s winget-extras".

  Due to a long-standing WinGet bug where "winget show" fails to display InstallerUrl values for certain rare BCP-47 locale tags even when specified, the following locales are not included: ach, an, ast, az, br, ff, fur, gd, ia, kab, lij, oc, sc, sco, son, sr, szl, ta, tg, trs, uz.
