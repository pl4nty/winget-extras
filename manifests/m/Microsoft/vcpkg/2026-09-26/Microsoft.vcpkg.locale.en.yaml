  - Bump brace-expansion from 1.1.15 to 1.1.18 in /vcpkg-artifacts by Dependabot (@dependabot)[bot] in #2114
  - Bump js-yaml from 4.2.0 to 4.3.2 in /vcpkg-artifacts by Dependabot (@dependabot)[bot] in #2117

