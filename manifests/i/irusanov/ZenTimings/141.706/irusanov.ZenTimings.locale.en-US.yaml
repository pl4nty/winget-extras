ReleaseNotes: |-
  - Fixed issue with reading SPD5118 hub (IDT/Renesas)
  - Removed the AdonisUI dependency while keeping the existing themes, with refreshed theme colors and more consistent styles across windows
  - The splash screen now shows core initialization progress
  - Added DDR4 SPD and DIMM thermal sensor support
  - Improved DDR5 SPD reading and redesigned the SPD and PMIC window, including EXPO extended timings
  - Extended APOB tables (now with DDR4 support) and added a new APOB window under Advanced Info
  - Added experimental reading of Vref values - available in Debug log and APOB and System windows (Tools -> Advanced Info)
  - Replaced BGS Alt with PowerDown; tCCDL is now shown as part of a combined value
  - Optional UCLK to MCLK ratio shown next to UCLK, toggled from the Tools menu (idea by @deadfellow34, PR#109 by @b1zya)
  - BurstLength and BurstCtrl are now decoded as readable text in the Advanced Timings window and debug report
  - VDDIO read from SuperIO is checked for a valid range, with a fallback to AOD if not. It can still be wrong on unsupported motherboards
  - Mismatched timings between channels are highlighted with neutral accent colors
  - DIMM info blocks can now be hidden in the Sensors window, plus several other QoL improvements
  - Fixed the Advanced Timings window not remembering its size and position
  - Improved the driver cleanup notification and fixed it blocking a new instance of the app from starting
  - SPD dumps now use a more descriptive filename
  - Fixed ASUS WMI resources not being released
  - Rendering and performance improvements
