ShortDescription: A disk usage analyser and cleanup assistant for Microsoft Windows. It scans local drives, selected drives, individual folders, and command-line targets, then shows where storage is being used through a sortable directory tree.
Description: |-
  A disk usage analyser and cleanup assistant for Microsoft Windows. It scans local drives, selected drives, individual folders, and command-line targets, then shows where storage is being used through a sortable directory tree.

  The winget-extras package differs from the winget-pkgs package, in that this package installs the MSIX version by default, and offers the portable version as a tertiary option.

  For the portable version, use "winget install WinDirStat.WinDirStat --installer-type portable -s winget-extras".
