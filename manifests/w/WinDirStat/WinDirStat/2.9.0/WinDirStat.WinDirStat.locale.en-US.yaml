Description: |-
  A disk usage analyzer and cleanup assistant for Microsoft Windows. It scans local drives, selected drives, individual folders, and command-line targets, then shows where storage is being used through a sortable directory tree.

  For the portable version, use "winget install WinDirStat.WinDirStat --installer-type portable -s winget-extras".
