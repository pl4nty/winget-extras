InstallationNotes: |-
  Installing the package only unpacks it. The "Locale Emulator" context menu entry is
  registered separately, by LEInstaller, which is on PATH with the rest of the package:

  - LEInstaller --InstallAll registers it for all users, and needs an elevated prompt.
  - LEInstaller on its own opens a window with buttons for the current user or all users.

  Run LEInstaller --UninstallAll before uninstalling the package. The registration points at
  these files by path, so removing them without it leaves a context menu entry that does
  nothing.
