ReleaseNotes: |-
  更新说明
  1.  修复 在最新 Win11 26H2 26300.9818 补丁后导致加速启动出现错误的问题
  2.  升级 .NET 11 RC3
  3.  升级 Avalonia 12.1.5
  4.  隐藏移除插件商店内容不再显示，移除首页的商城内容
  5.  修复开启加速关机时可能导致的错误弹窗
  6.  修复首页无内容时格式问题
  7.  修复 CNG Key Isolation 服务禁用时加速出错没有正确提示问题
  8.  修复库存游戏编辑保存失败的问题
  9.  修复了一些失效加速项
  10. 库存游戏加载速度优化
  11. Steam 令牌现在支持扫描屏幕二维码快速登录账号
  12. Steam 挂卡登录方式支持扫描二维码登录和令牌对应账号登录
  13. 修复 Steam 路径设置没有正常生效的问题
  14. 挂时长自动运行时现在会弹出提示
  15. 优化 网络加速 DNS 配置相关设置与自动检测
  16. 重构 Linux 系统代理并支持动态切换 Accelerator 代理
  17. 支持 Linux IPC 进程校验并支持原生 UI 退出处理
  18. 更新 macOS 菜单项，修改隐藏窗口的快捷键并简化菜单结构
  19. 修复某些账号登录时会有序列化异常报错问题
  20. 修复 Steam 账号快捷方式创建时默认头像账号会导致闪退的异常
  21. 清除网络加速默认日志并统一使用自定义日志提供程序

