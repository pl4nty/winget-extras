ShortDescription: Cross-platform C++ virtual HID library, with a Windows driver for virtual input devices
Description: libvirtualhid provides a platform-neutral C++ API for creating virtual input devices. The primary target is gamepad input for remote streaming hosts and other low-latency applications, with keyboard, mouse, touchscreen, trackpad, and pen tablet support available where the platform backend supports those device types.
