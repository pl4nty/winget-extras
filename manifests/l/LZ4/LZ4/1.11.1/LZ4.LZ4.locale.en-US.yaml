ReleaseNotes: |-
  LZ4 v1.11.1 is a point release, whose main purpose is to fix LZ4_resetStreamHC(), an obsolete symbol, on dirty memory. While reset functions are expected to reset valid states, LZ4_resetStreamHC() has been working fine on dirty memory, which made it possible to employ it as an initializer instead. Hence, some (hopefully rare) applications may have developed a dependency on this property. v1.11.0 did not respect this undocumented behavior: on a dirty state, compression at levels >= 10 could result in a write out of bounds. Thus v1.11.1 is released to restore the previous behavior.
  This is mostly of importance for distributions and package managers, as liblz4 may be paired with older binaries that are no longer updated. LZ4_resetStreamHC() was replaced by LZ4_initStreamHC() in v1.9.0 (2019). Applications still employing this symbol are invited to migrate.
  This release also restores the (deprecated) unprefixed lz4frame enums, for applications that still need them. They now generate a deprecation warning: once again, actively maintained applications should move to the prefixed names. Build configurations accidentally broken in v1.11.0 work again: make with BUILD_STATIC=no or BUILD_SHARED=no, and MinGW with clang and lld.
  Finally, decompression speed on ppc64 receives a sizable boost (+12% to +24% on silesia), thanks to @runlevel5.
  Changes list
  - fix : LZ4_resetStreamHC() could write out of bounds at levels >= 10, on a state containing garbage (since v1.11.0)
  - perf : faster decompression on ppc64 (+12% to +24% on silesia), LZ4_FAST_DEC_LOOP enabled, by @runlevel5
  - perf : lz4 -l compresses small files up to 10x faster : no more threads than blocks
  - api : restored the unprefixed lz4frame enums and types (LZ4F_ENABLE_OBSOLETE_ENUMS), employed by zstd, now deprecated (compilation warning), reported by @diizzyy
  - cli : help (-h, -H, --help) outputs to stdout, requested by @tansy
  - cli : --list reads standard input again (since v1.10.0)
  - cli : various fixes (--list, --stdout, --force, multiple inputs, Windows pipes, modification time, output creation), by @lee3Q, @immanuwell and @rudycelekli
  - build: lz4file.h usable from cmake (since v1.10.0) and meson installations, reported by @rudycelekli
  - build: MinGW builds with clang and lld (since v1.11.0), reported by @tansy
  - build: make with BUILD_STATIC=no or BUILD_SHARED=no (since v1.11.0), by @xry111
