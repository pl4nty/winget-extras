  Changelog
  Changelog

  Added
  - feat: request approval #16784

  Changes
  - Only relay to addresses this peer offered, and bound relay uuids #16858

  Fixes
  - fix(macos): turn privacy mode off before locking at session end #16729
  - fix(flutter): keep Windows accept window side panels on the current monitor #16855
  - fix(windows): drop the named-pipe installer handoff that F-Secure blocks #16889
  - fix(port-forward): keep the KCP handle alive and send a close reason #16880
  - fix(linux): serve a greetd Wayland login screen over DRM #16894
  - fix(macos): launch the service daemon directly instead of through sh #16879
  - fix: block sensitive config options in strategy updates #16696
  - fix(windows): continue removal after configuration sync errors #16865
  - fix(drm): stop re-encoding a still screen #16888
  - fix(windows): retry service IPC before terminating the GUI #16913
  - Fix/windows installer directory guard #16908
  - fix(audio): look up the named audio input among input devices only #16906
  - fix(windows): write the clipboard owner marker first #16695
  - fix(server): ignore spaces around IP whitelist entries #16692
  - Fix/windows ipc server auth #16755
  - Fix/windows installer temp junction #16871
  - fix(android): prevent crash on large clipboard payload (>1MB) #16767
  - fix(sciter): avoid double DPI scaling of main window minimum size #16824
  - fix(ios): follow system dark mode on launch screen #16816
  - fix(android): copy captured frames before the Image is released #16827
  - fix(lang): pick Hebrew and Indonesian from legacy Android locale codes #16882
  - fix(wayland): pass on an unclassified capture error instead of "x11 expected" beeeef14
