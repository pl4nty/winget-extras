ReleaseNotes: |-
  Changelog
  - Upgrade Electron to 44.1.1 (44.x on win/linux x64+arm64, 43.x on win x86)
  - Harden Electron window navigation (will-navigate/setWindowOpenHandler, webSecurity on)
  - Worker memory: zero-copy emitBinary and mpegts length handling
  - Support binary events across multiple workers
  - Fix countries list in options and enable auto-test by default
  - Minor bugfixes and improvements

  Android Notes
  If you run into an error when installing the new version, uninstall the old one first, then try installing the new version again.

  Linux Notes
  On Linux, you can easily download and install by running this command in your terminal:
  wget -qO- https://megacubo.tv/install.sh | bash
  To uninstall, just run:
  wget -qO- https://megacubo.tv/uninstall.sh | bash

  MacOS Notes
