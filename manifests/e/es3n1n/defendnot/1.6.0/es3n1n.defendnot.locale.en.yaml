ShortDescription: An even funnier way to disable Windows Defender.
Description: |-
  defendnot registers a dummy antivirus product through the undocumented Windows Security Center API, so Windows shuts Microsoft Defender off itself to avoid running two antivirus products at once. The loader adds an autorun task to keep the registration across reboots, can optionally register a fake firewall, and undoes everything with --disable.
  Real-time protection and tamper protection may need to be turned off temporarily before first launch, otherwise Defender blocks the binaries. Newer Windows 11 builds may also require turning off Smart App Control.
