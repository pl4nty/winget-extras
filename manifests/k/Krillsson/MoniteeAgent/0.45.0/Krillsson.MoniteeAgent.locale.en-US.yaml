ReleaseNotes: |-
  - FileSystem.spaceForecast estimates when a filesystem will fill up from its usage trend, with a low/high day range and the daily history points behind it. Also reports a trend of GROWING, SHRINKING or STABLE, so a non-growing filesystem still gets a result instead of nothing.
  - Fix: File downloads no longer stall after 30 seconds regardless of transfer progress.
  - DockerContainer.labels exposes a container's Docker labels.
  - containerGroups groups containers by their com.docker.compose.project label, with containers missing that label collected into one ungrouped group.
  Changes from .0.44.0
  - Updates to container updates:
    - updateDockerContainers update several containers in a batch. Cancel with abortDockerContainerBatchUpdate
    - containerUpdateJob and containerBatchUpdateJob lets a client discover ongoing updates without any context about them.
    - DockerContainer.updateEligibility explains the update gating. For example when attempting to update a container that exposes a network.
  - Fix: More clear errors when file operations fail with no space left or permission error.
  - Fix: fileSystems { metrics { totalSpaceBytes } } no longer re-enumerates every filesystem once per filesystem.
  See monitee.app/get-started for installation instructions
