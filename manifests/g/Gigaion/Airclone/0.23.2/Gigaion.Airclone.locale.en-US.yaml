ReleaseNotes: |-
  Airclone v0.23.2 — sign in again, and an rclone security update

  Sign in again
  A cloud you signed in to (Google Drive, OneDrive, Dropbox, Box…) can stop
  letting Airclone in: the sign-in expired, you changed your password, or you
  removed access. Until now the only fix was to delete the remote and add it
  again, losing its settings.
  Now the remote's ⋯ menu has Sign in again. Sign in in your browser as
  usual, and only the sign-in is replaced: the name, folders, Shared Drive and
  every other setting stay as they are. When opening a folder or Test
  connection fails because the sign-in stopped working, the error has a
  Sign in again button too.

  rclone v1.75.2
  The bundled engine moves to rclone v1.75.2, a security release: fixes for
  paths escaping the root through .rclonelink files, credentials leaking on
  redirects, and a batch of Go networking CVEs, plus fixes for VFS reads and
  transfer speed reporting.

  iPhone and iPad: free public beta
  iOS can't install apps from a download, so there is now a free public
  TestFlight beta: https://testflight.apple.com/join/kHRBzZnc

  Notes
  - Windows builds are signed (Azure Artifact Signing, OV-class — SmartScreen
    may still warn until the certificate builds reputation). macOS builds are
    signed and notarized with a Developer ID.
  - Store versions follow on each store's own schedule.
