Description: |-
  Mexsus Uyghurche tehrirlesh üchün tüzülgen, Imla tekshürüsh (Imlasi xata sözlerning astigha qizil siziq bilen dawamliq körsitip bérish), Yéziqlarni almashturush, OCR (Resimdiki tékistlerni tonush) iqtidari bolghan, heqsiz tehrirligüch.

  مەخسۇس ئۇيغۇرچە تەھرىرلەش ئۈچۈن تۈزۈلگەن، ئىملا تەكشۈرۈش (ئىملاسى خاتا سۆزلەرنىڭ ئاستىغا قىزىل سىزىق بىلەن داۋاملىق كۆرسىتىپ بېرىش)، يېزىقلارنى ئالماشتۇرۇش، ئوCر (رەسىمدىكى تېكىستلەرنى تونۇش) ئىقتىدارى بولغان، ھەقسىز تەھرىرلىگۈچ.

  Мәхсус Уйғурчә тәһрирләш үчүн түзүлгән, Имла тәкшүрүш (Имласи хата сөзләрниң астиға қизил сизиқ билән давамлиқ көрситип бериш), Йезиқларни алмаштуруш, ОСР (Рәсимдики текистләрни тонуш) иқтидари болған, һәқсиз тәһрирлигүч.
