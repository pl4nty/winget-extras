name: Detect installers to validate
description: Build a matrix of installers to validate, from a package version or the manifests a pull request changes

inputs:
  package-id:
    description: Package identifier to validate. Leave empty to use the manifests a pull request changes
    required: false
  version:
    description: Package version to validate, with package-id
    required: false

outputs:
  installers:
    description: JSON array of installers, each with path, arch, scope and type
    value: ${{ steps.matrix.outputs.installers }}

runs:
  using: composite
  steps:
    - name: Get changed manifests
      id: changed
      if: github.event_name == 'pull_request' && !inputs.package-id
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          manifests/**/*.installer.yaml
          fonts/**/*.installer.yaml
        dir_names: true
        json: true
        escape_json: false

    - name: Build matrix
      id: matrix
      shell: pwsh
      env:
        PACKAGE_ID: ${{ inputs.package-id }}
        VERSION: ${{ inputs.version }}
        CHANGED: ${{ steps.changed.outputs.all_changed_files }}
      run: |
        $packages = @(if ($env:PACKAGE_ID) {
          $relativePath = "$($env:PACKAGE_ID.Substring(0,1).ToLower())/$($env:PACKAGE_ID -replace '\.', '/')/$($env:VERSION)"
          if (Test-Path "fonts/$relativePath") { "fonts/$relativePath" } else { "manifests/$relativePath" }
        } elseif ($env:CHANGED) {
          $env:CHANGED | ConvertFrom-Json | Select-Object -Unique | Where-Object { Test-Path $_ }
        })

        # Installer entries that share a path/arch/scope/type (e.g. locale-only
        # variants) resolve to the same validate.ps1 selection, so only the first
        # is kept - otherwise duplicate matrix jobs collide on the same
        # concurrency group and cancel each other out.
        $installers = @($packages | ForEach-Object {
          $manifestPath = Get-ChildItem $_ -Filter *.installer.yaml
          $manifest = yq -o=json $manifestPath | ConvertFrom-Json
          $manifest.Installers | ForEach-Object {
            @{
              path = $manifestPath | Resolve-Path -Relative;
              arch = $_.Architecture;
              scope = $_.Scope ?? $manifest.Scope;
              type = $_.InstallerType ?? $manifest.InstallerType
            }
          }
        } | Group-Object { "$($_.path)|$($_.arch)|$($_.scope)|$($_.type)" } | ForEach-Object { $_.Group[0] })

        # ConvertTo-Json can't produce [] for an empty set, so emit the literal
        # instead. The installers must be piped rather than passed as -InputObject:
        # a parameter binds the whole array as one object, which -AsArray then nests
        # into [[...]] - a single matrix entry holding an array, so every
        # matrix.installer field reads as empty.
        $json = if ($installers.Count) {
          $installers | ConvertTo-Json -Compress -Depth 5 -AsArray
        } else { '[]' }
        "installers=$json" >> $env:GITHUB_OUTPUT
