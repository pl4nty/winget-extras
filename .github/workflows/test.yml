name: Test

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
  workflow_dispatch:
    inputs:
      packages:
        description: Package IDs to test (space-separated)
        required: false
        type: string

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  detect-changes:
    name: Detect Changed Shards
    if: ${{ !inputs.packages }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    concurrency:
      group: test-detect-changes-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
      changed_files: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: shards/**
          files_ignore: |
            shards/**/*.disabled
            shards/auto-remove.json
          json: true
          escape_json: false

  test:
    name: Test
    needs: detect-changes
    if: always() && (needs.detect-changes.outputs.any_changed == 'true' || inputs.packages)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    concurrency:
      group: test-job-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.21
          install_args: bun

      - name: Install Dependencies
        run: bun ci

      - name: Test Packages
        run: |
          if [ -n "$PACKAGES" ]; then
            PACKAGE_IDS="$PACKAGES"
          else
            PACKAGE_IDS=""
            while IFS= read -r file; do
              PACKAGE_IDS+="$(basename "${file%.*}") "
            done < <(jq -r '.[]' <<< "$CHANGED_FILES")
            PACKAGE_IDS="${PACKAGE_IDS% }"
          fi

          bun test:shard "$PACKAGE_IDS" --dry-run
          # Anthelion lists the generated manifests by path in the step summary.
          cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/dry-run.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          KOMAC_GITHUB_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          KOMAC_GITHUB_REPO: ${{ github.event.pull_request.head.repo.name || github.event.repository.name }}
          KOMAC_GITHUB_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_files }}
          PACKAGES: ${{ inputs.packages }}

      - name: Compare Dry Run With Manifests
        run: bun manifests:check --rule repository/dry-run
        env:
          DRY_RUN_SUMMARY: ${{ runner.temp }}/dry-run.md
