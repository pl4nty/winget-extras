name: Validate

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Package ID (e.g., Microsoft.AzIPLogViewer)'
        required: true
        type: string
      version:
        description: 'Package version (e.g., 1.0)'
        required: true
        type: string

permissions: {}

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-slim
    timeout-minutes: 5
    concurrency:
      group: validate-detect-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      installers: ${{ steps.matrix.outputs.installers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get changed manifests
        id: changed
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            manifests/**/*.installer.yaml
            fonts/**/*.installer.yaml
          dir_names: true
          json: true
          escape_json: false

      - name: Build matrix
        id: matrix
        shell: pwsh
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          VERSION: ${{ inputs.version }}
          CHANGED: ${{ steps.changed.outputs.all_changed_files }}
        run: ./scripts/ci/validate/matrix.ps1

  validate:
    name: Installation Validation (${{ matrix.installer.id }} ${{ matrix.installer.version }}, ${{ matrix.installer.arch }} | ${{ matrix.installer.scope || 'default' }} | ${{ matrix.installer.type || 'default' }})
    needs: detect
    if: needs.detect.outputs.installers != '[]'
    runs-on: ${{ matrix.installer.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        installer: ${{ fromJSON(needs.detect.outputs.installers) }}
    # Keyed by matrix entry as well as ref, so a new run cancels only the stale
    # run of the same installer rather than the sibling matrix jobs.
    concurrency:
      group: validate-install-${{ github.event.pull_request.number || github.ref }}-${{ matrix.installer.path }}-${{ matrix.installer.arch }}-${{ matrix.installer.scope }}-${{ matrix.installer.type }}
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/validate
            ${{ matrix.installer.path }}

      - name: Install Attack Surface Analyzer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Import-Module ./scripts/ci/validate/Validation.psm1
          Install-AttackSurfaceAnalyzer

      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Validate
        id: validate
        run: |
          ./scripts/ci/validate/run.ps1 `
            -ManifestPath $env:MANIFEST_PATH `
            -Arch $env:ARCH `
            -Scope $env:SCOPE `
            -InstallerType $env:INSTALLER_TYPE
        env:
          MANIFEST_PATH: ${{ matrix.installer.path }}
          ARCH: ${{ matrix.installer.arch }}
          SCOPE: ${{ matrix.installer.scope }}
          INSTALLER_TYPE: ${{ matrix.installer.type }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - parallel:
          - name: Upload screenshot
            if: always() && steps.validate.outputs.artifact_name
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
              path: ${{ runner.temp }}\artifacts\${{ steps.validate.outputs.artifact_name }}.png
              if-no-files-found: ignore
              archive: false

          - name: Upload SARIF
            if: always() && steps.validate.outputs.artifact_name
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
              name: ${{ steps.validate.outputs.artifact_name }}-asa
              path: ${{ runner.temp }}\artifacts\${{ steps.validate.outputs.artifact_name }}-asa.sarif
              if-no-files-found: ignore

          - name: Upload installer metadata
            if: always() && steps.validate.outputs.artifact_name
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
              name: ${{ steps.validate.outputs.artifact_name }}-metadata
              path: |
                ${{ runner.temp }}/artifacts/${{ steps.validate.outputs.artifact_name }}-metadata.json
                ${{ runner.temp }}/artifacts/${{ steps.validate.outputs.artifact_name }}-correlation.log
              if-no-files-found: ignore
