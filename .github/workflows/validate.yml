name: Validate

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Package ID (e.g., Microsoft.AzIPLogViewer)'
        required: true
        type: string
      version:
        description: 'Package version (e.g., 1.0)'
        required: true
        type: string
  # schedule:
  #   # Daily run on main to populate the Attack Surface Analyzer baseline cache
  #   - cron: '0 0 * * *'

permissions: {}

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-slim
    timeout-minutes: 5
    concurrency:
      group: validate-detect-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      installers: ${{ steps.matrix.outputs.installers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect installers
        id: matrix
        uses: $/.github/actions/validate-detect
        with:
          # The schedule fallback populates the Attack Surface Analyzer baseline cache
          package-id: ${{ inputs.package_id || (github.event_name == 'schedule' && 'Microsoft.ConfigMgr.SupportCenter' || '') }}
          version: ${{ inputs.version || (github.event_name == 'schedule' && '5.2509.1065.1000' || '') }}

  validate:
    name: Installation Validation
    needs: detect
    if: needs.detect.outputs.installers != '[]'
    runs-on: ${{ matrix.installer.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    permissions:
      pull-requests: write # Comment the screenshot link on the PR.
    strategy:
      fail-fast: false
      matrix:
        installer: ${{ fromJSON(needs.detect.outputs.installers) }}
    # Keyed by matrix entry as well as ref, so a new run cancels only the stale
    # run of the same installer rather than the sibling matrix jobs.
    concurrency:
      group: validate-install-${{ github.event.pull_request.number || github.ref }}-${{ matrix.installer.path }}-${{ matrix.installer.arch }}-${{ matrix.installer.scope }}-${{ matrix.installer.type }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            ${{ matrix.installer.path }}

      - name: Validate
        uses: $/.github/actions/validate
        with:
          path: ${{ matrix.installer.path }}
          arch: ${{ matrix.installer.arch }}
          scope: ${{ matrix.installer.scope }}
          type: ${{ matrix.installer.type }}
          source-name: winget-extras
          source-url: https://winget.tplant.com.au/cache
