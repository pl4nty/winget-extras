name: Lint Actions

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  lint-actions:
    name: Lint Actions
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      security-events: write # Required for upload-sarif to upload SARIF files.
    concurrency:
      group: lint-actions-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.9
          install_args: zizmor actionlint shellcheck

      - parallel:
          - name: Run zizmor 🌈
            run: |
              zizmor . --pedantic --color=always --format=sarif > zizmor.sarif
            env:
              ZIZMOR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          - name: Run actionlint
            continue-on-error: true
            run: |
              actionlint -format "$(cat .github/actionlint-sarif.txt)" -color \
                -ignore 'label "ubuntu-26\.04-arm" is unknown' \
                -ignore 'reusable workflow call "\$/\.github/workflows/[^" ]+\.yml".*not following the format' \
                -ignore 'step must run script with "run" section or run action with "uses" section' \
                > actionlint.sarif

      - parallel:
          - name: Upload zizmor SARIF file
            uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
            with:
              sarif_file: zizmor.sarif
              category: zizmor

          - name: Upload actionlint SARIF file
            uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
            with:
              sarif_file: actionlint.sarif
              category: actionlint
