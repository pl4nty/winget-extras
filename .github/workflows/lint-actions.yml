name: Lint Actions

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  lint-actions:
    name: Lint Actions
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      security-events: write # Required for upload-sarif to upload SARIF files.
    concurrency:
      group: lint-actions-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.7.12
          install_args: zizmor actionlint shellcheck

      - parallel:
          - name: Run zizmor 🌈
            run: |
              zizmor . --pedantic --color=always --format=sarif > zizmor.sarif
            env:
              ZIZMOR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          - name: Run actionlint
            continue-on-error: true
            run: |
              actionlint -format "$(cat .github/actionlint-sarif.txt)" -color \
                -ignore 'label "ubuntu-26\.04-arm" is unknown' \
                -ignore 'step must run script with "run" section or run action with "uses" section' \
                > actionlint.sarif

      - parallel:
          - name: Upload zizmor SARIF file
            uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
            with:
              sarif_file: zizmor.sarif
              category: zizmor

          - name: Upload actionlint SARIF file
            uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
            with:
              sarif_file: actionlint.sarif
              category: actionlint
