name: autofix.ci

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.21
          install_args: bun zizmor github:unpn-org/Komac

      - name: Install Dependencies
        run: bun ci

      - parallel:
          - name: Fix Linting
            run: bun lint --fix

          - name: Fix Actions
            run: |
              zizmor . --pedantic --fix=safe --color=always
            env:
              ZIZMOR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          - name: Fix Manifests
            run: bun manifests:fix

      - parallel:
          - name: Format Manifests
            run: komac format

          - name: Fix Formatting
            run: bun fmt

      - name: Apply Fixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
