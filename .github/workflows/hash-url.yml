# Temporary: computes hashes the sandbox proxy cannot reach. Removed after use.
name: Hash URL

on:
  push:
    branches: [claude/manifest-linter-branch-rule-37tn2k]
    paths: ['.github/workflows/hash-url.yml']

permissions: {}

jobs:
  hash:
    name: Hash URL
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Hash
        run: |
          url='https://github.com/shaunsingh/SFMono-Nerd-Font-Ligaturized/archive/dc5a3e6fcc2e16ad476b7be3c3c17c2273b260ea.zip'
          curl -sSL "$url" -o font.zip
          sha256sum font.zip
          unzip -l font.zip | head -n 8
