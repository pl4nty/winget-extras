name: Probe VCRedist keys
on:
  push:
    branches: [claude/project-thread-3plf79]
    paths: [.github/workflows/probe-vcredist.yml]
permissions: {}
jobs:
  probe:
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: pwsh
        run: |
          foreach ($v in '64','32') { foreach ($a in 'x64','x86','arm64') { Write-Host "view $v $a"; reg query "HKLM\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\$a" /v Version /reg:$v } }
          Get-ChildItem HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall, HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -like '*C++*Redistributable*' | Select-Object DisplayName, DisplayVersion | Format-Table -AutoSize
          exit 0
