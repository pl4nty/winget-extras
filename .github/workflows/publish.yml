name: publish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yml'
      - 'index/**'
      - 'manifests/**'
      - 'fonts/**'
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge Manifests
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Merge manifests
        uses: $/.github/actions/merge

      - parallel:
          - name: Upload merged manifests
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
              name: merged-manifests
              path: ${{ runner.temp }}/manifests/*.yaml
              if-no-files-found: error

          - name: Upload index
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
              name: index
              path: index
              if-no-files-found: error

  publish:
    name: Publish Manifests
    needs: merge
    runs-on: windows-2025
    permissions:
      id-token: write # Required for azure/login to request an OIDC token.
    steps:
      - parallel:
          - name: Download index
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            with:
              name: index
              path: index

          - name: Download merged manifests
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            with:
              name: merged-manifests
              path: ${{ runner.temp }}/manifests

      - name: Publish source
        uses: $/.github/actions/publish
        with:
          signing-backend: azuresigntool
          storage-backend: cloudflare-r2
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          key-vault-url: ${{ vars.KEY_VAULT_URL }}
          key-vault-cert: ${{ vars.KEY_VAULT_CERT }}
          s3-bucket: winget-extras
          s3-endpoint: https://20e0944718a914755e926a8ac51178d7.r2.cloudflarestorage.com
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          cloudflare-public-url: https://winget.tplant.com.au/cache
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-rule-url: ${{ vars.CLOUDFLARE_RULE_URL }}
