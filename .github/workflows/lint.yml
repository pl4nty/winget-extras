name: Lint Project

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  lint-project:
    name: Lint Project
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    concurrency:
      group: lint-project-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0
          install_args: bun

      - name: Install Dependencies
        run: bun ci

      - parallel:
          - name: Check Formatting
            run: bun fmt --check

          - name: Lint & Type check
            run: bun lint --deny-warnings

          - name: Check Manifests
            run: bun manifests:check --deny-warnings

          - name: Test Manifest Validation
            run: bun test:manifests --deny-warnings
