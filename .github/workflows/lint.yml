name: Lint Project

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  lint-project:
    name: Lint Project
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    concurrency:
      group: lint-project-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: bun github:unpn-org/Komac

      - name: Install Dependencies
        run: bun ci

      - parallel:
          - name: Check Formatting
            run: bun fmt --check

          - name: Check Manifest Formatting
            run: komac format --check

          - name: Lint & Type check
            run: bun lint --deny-warnings

          - name: Check Manifests
            run: bun manifests:check --deny-warnings

          - name: Test Manifest Validation
            run: bun test:manifests --deny-warnings
