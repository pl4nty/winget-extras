name: Lint Project

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  lint-project:
    name: Lint Project
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    concurrency:
      group: lint-project-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.17
          install_args: bun

      - name: Install Dependencies
        run: bun ci

      - parallel:
          - name: Check Formatting
            run: bun fmt --check

          - name: Lint & Type check
            run: bun lint --deny-warnings

          - name: Check Manifests
            run: bun manifests:check

          - name: Test Manifest Validation
            run: bun test:manifests --deny-warnings
