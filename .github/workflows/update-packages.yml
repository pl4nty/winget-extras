name: Update Packages

on:
  workflow_dispatch:
  schedule:
    - cron: 19,57 * * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  update-packages:
    name: Update Packages
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.21
          install_args: bun

      - name: Install Dependencies
        run: bun ci --production

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.GH_CLIENT_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update Packages
        run: bun start
        env:
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          KOMAC_GITHUB_OWNER: ${{ github.repository_owner }}
          KOMAC_GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
